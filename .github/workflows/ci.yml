name: CI

on:
  push:
    branches: [master, feat/web-platform]
  pull_request:
    branches: [master, feat/web-platform]

jobs:
  backend:
    name: Backend (compile + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx
      - name: Compile (syntax check)
        run: python -m compileall src backend
      - name: Run tests
        run: python -m pytest backend/tests -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Build (tsc + vite)
        run: npm run build
        working-directory: frontend

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t cdt-backend .
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t cdt-frontend .
